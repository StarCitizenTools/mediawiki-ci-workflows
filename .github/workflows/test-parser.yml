name: 🧪 Test PHP Parser

on:
  workflow_call:
    inputs:
      project-type:
        description: "'skin' or 'extension'"
        type: string
        required: true
      project-name:
        description: "e.g. Citizen, TabberNeue"
        type: string
        required: true
      matrix:
        description: >
          JSON array of matrix entries. Each entry: {"mw": "REL1_43", "php": "8.3", "experimental": false}.
        type: string
        default: >
          [
            {"mw": "REL1_43", "php": "8.3", "experimental": false},
            {"mw": "REL1_44", "php": "8.3", "experimental": false},
            {"mw": "REL1_45", "php": "8.4", "experimental": false},
            {"mw": "REL1_46", "php": "8.5", "experimental": false},
            {"mw": "master", "php": "8.5", "experimental": true}
          ]
      extra-extensions:
        description: "Space-separated list of extra extensions to download and load (e.g. 'Scribunto')"
        type: string
        default: ""
      skip-cache:
        description: "Install MW from scratch instead of restoring the cache, then save it (set true for nightly runs)"
        type: boolean
        default: false
      runner:
        description: "Runner image (e.g. 'ubuntu-latest', 'ubuntu-24.04-arm')"
        type: string
        default: ubuntu-latest

jobs:
  test:
    name: "MW ${{ matrix.entry.mw }}, PHP ${{ matrix.entry.php }}"
    continue-on-error: ${{ matrix.entry.experimental }}
    timeout-minutes: 30
    runs-on: ${{ inputs.runner }}

    strategy:
      matrix:
        entry: ${{ fromJSON(inputs.matrix) }}

    defaults:
      run:
        working-directory: mediawiki

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.entry.php }}
          extensions: mbstring, intl
          tools: composer

      - name: Compute MediaWiki cache key
        id: cache-key
        working-directory: ~
        # `extra-extensions` participates in the key so changing which
        # extensions get loaded reliably invalidates LocalSettings.php. The
        # UTC date refreshes the tree daily: actions/cache never overwrites
        # an existing key, so without it the tree would stay at whichever
        # commit the branch was on when it was first cached.
        run: echo "key=mw-${{ matrix.entry.mw }}-php${{ matrix.entry.php }}-${{ inputs.project-name }}-${{ inputs.extra-extensions }}-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore MediaWiki cache
        if: ${{ !inputs.skip-cache }}
        id: cache-mediawiki
        uses: actions/cache/restore@v5
        with:
          path: mediawiki
          key: ${{ steps.cache-key.outputs.key }}

      - name: Cache Composer cache
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-php${{ matrix.entry.php }}

      - name: Download MediaWiki
        if: steps.cache-mediawiki.outputs.cache-hit != 'true' || inputs.skip-cache
        working-directory: ~
        run: |
          rm -rf mediawiki
          wget "https://github.com/wikimedia/mediawiki/archive/refs/heads/${{ matrix.entry.mw }}.tar.gz" -nv
          tar -zxf "${{ matrix.entry.mw }}.tar.gz"
          mv "mediawiki-${{ matrix.entry.mw }}" mediawiki
          cd mediawiki
          wget "https://raw.githubusercontent.com/wikimedia/mediawiki/${{ matrix.entry.mw }}/phpunit.xml.dist" -nv || \
            wget "https://raw.githubusercontent.com/wikimedia/mediawiki/${{ matrix.entry.mw }}/phpunit.xml.template" -nv
          composer install --no-ansi --no-interaction --no-progress
          php maintenance/install.php --dbtype sqlite --dbuser root --dbname mw --dbpath "$(pwd)" --pass AdminPassword WikiName AdminUser

      - name: Configure MediaWiki
        if: steps.cache-mediawiki.outputs.cache-hit != 'true' || inputs.skip-cache
        run: |
          LOAD_FN=${{ inputs.project-type == 'skin' && 'wfLoadSkin' || 'wfLoadExtension' }}
          cat <<EOT >> LocalSettings.php
          error_reporting(E_ALL| E_STRICT);
          ini_set("display_errors", "1");
          \$wgShowExceptionDetails = true;
          \$wgShowDBErrorBacktrace = true;
          \$wgDevelopmentWarnings = true;
          EOT
          for ext in ${{ inputs.extra-extensions }}; do
            echo "wfLoadExtension( '$ext' );" >> LocalSettings.php
          done
          echo "$LOAD_FN( '${{ inputs.project-name }}' );" >> LocalSettings.php

      - name: Save MediaWiki cache
        if: steps.cache-mediawiki.outputs.cache-hit != 'true' || inputs.skip-cache
        # Save right after the install, before the project and extra
        # extensions are added, so the cache holds only MediaWiki and its
        # freshly installed database. `skip-cache` runs skip the restore but
        # still save, so a nightly run early in the UTC day builds that day's
        # cache. If the key already exists, the save is skipped with a log
        # message rather than an error.
        uses: actions/cache/save@v5
        with:
          path: mediawiki
          key: ${{ steps.cache-key.outputs.key }}

      - uses: actions/checkout@v6
        with:
          path: mediawiki/${{ inputs.project-type == 'skin' && 'skins' || 'extensions' }}/${{ inputs.project-name }}
          fetch-depth: 0

      - name: Download extra extensions
        if: inputs.extra-extensions != ''
        run: |
          for ext in ${{ inputs.extra-extensions }}; do
            echo "Downloading $ext..."
            wget "https://github.com/wikimedia/mediawiki-extensions-${ext}/archive/refs/heads/${{ matrix.entry.mw }}.tar.gz" -nv -O "${ext}.tar.gz"
            rm -rf "extensions/${ext}"
            tar -zxf "${ext}.tar.gz"
            mv "mediawiki-extensions-${ext}-${{ matrix.entry.mw }}" "extensions/${ext}"
            rm "${ext}.tar.gz"
          done

      - name: Install dependencies
        run: composer update --no-ansi --no-interaction --no-progress

      - name: Run parser tests
        run: |-
          PROJECT_PATH="${{ inputs.project-type == 'skin' && 'skins' || 'extensions' }}/${{ inputs.project-name }}"
          PARSER_TEST_DIR="$PROJECT_PATH/tests/parser"
          if ! ls "$PARSER_TEST_DIR"/*.txt > /dev/null 2>&1; then
            echo "No parser tests found at $PARSER_TEST_DIR — skipping."
            exit 0
          fi
          for f in "$PARSER_TEST_DIR"/*.txt; do
            echo "::group::Running parser tests from $f"
            php tests/parser/parserTests.php --file="$f"
            echo "::endgroup::"
          done
